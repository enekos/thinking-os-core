[package]
name = "thinking-os-tools"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "The thinking-os graph pipeline (sare), GitHub event watcher (zaindu) and graph viewer (ikusi)"

[lib]
name = "os"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
rc_mutex = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
dbg_macro = "deny"
todo = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
sutegi = { git = "https://github.com/enekos/sutegi", tag = "v0.11.0", default-features = false, features = ["graceful"] }

[[bin]]
name = "zaindu"
path = "src/bin/zaindu.rs"

[[bin]]
name = "sare"
path = "src/bin/sare.rs"

[[bin]]
name = "ikusi"
path = "src/bin/ikusi.rs"
