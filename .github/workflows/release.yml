name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for script in install.sh packaging/*.sh; do bash -n "$script"; done
      - run: packaging/test-install.sh

  build:
    needs: installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check release tag
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: artalde
      - run: cargo test --release --locked --manifest-path tools/Cargo.toml
      - run: cargo test --release --locked --manifest-path artalde/Cargo.toml --workspace
      - run: cargo build --release --locked --manifest-path tools/Cargo.toml
      - run: cargo build --release --locked --manifest-path artalde/Cargo.toml --package artalde
      - name: Smoke test binaries
        run: |
          tools/target/release/sare --version
          tools/target/release/zaindu --version
          tools/target/release/ikusi --version
          artalde/target/release/artalde --version
      - name: Package release
        run: |
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cat VERSION)"
          fi
          packaging/build-release.sh --version "$version" --target "${{ matrix.target }}"
      - name: Verify packaged archive
        run: |
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cat VERSION)"
          fi
          package="thinking-os-core-${version}-${{ matrix.target }}"
          verify="$(mktemp -d "${TMPDIR:-/tmp}/thinking-os-verify.XXXXXX")"
          tar -xzf "dist/${package}.tar.gz" -C "$verify"
          test "$(cat "$verify/$package/VERSION")" = "$version"
          for tool in sare zaindu ikusi artalde; do
            "$verify/$package/bin/$tool" --version
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test "${tag#v}" = "$(cat VERSION)"
          cat dist/*.tar.gz.sha256 > dist/SHA256SUMS
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "thinking-os-core $tag" --generate-notes
          fi
          gh release upload "$tag" --clobber install.sh dist/*.tar.gz dist/SHA256SUMS
