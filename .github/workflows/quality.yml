name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --manifest-path tools/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path tools/Cargo.toml --workspace --all-features
      - run: cargo install cargo-machete --locked
      - run: cargo machete tools

  artalde:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS Apple Silicon
            os: macos-15
    name: artalde (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux windowing dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: artalde
      - run: cargo fmt --manifest-path artalde/Cargo.toml --all --check
      - run: cargo clippy --manifest-path artalde/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path artalde/Cargo.toml --workspace --locked
