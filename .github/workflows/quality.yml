name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ikusi-web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/ikusi-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tools/ikusi-web/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: git diff --exit-code -- ../src/ikusi/web
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --manifest-path tools/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path tools/Cargo.toml --workspace --all-features
      - run: cargo install cargo-machete --version 0.9.1 --locked
      - run: cargo machete tools

  artalde:
    # eframe needs a desktop target; artalde's terminal actions are macOS-only.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Ghostty's emulator, built by artalde-vt.
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: artalde
      - run: cargo fmt --manifest-path artalde/Cargo.toml --all --check
      - run: cargo clippy --manifest-path artalde/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path artalde/Cargo.toml --workspace

  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS Apple Silicon
            os: macos-15
    name: installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: for script in install.sh packaging/*.sh; do bash -n "$script"; done
      - run: packaging/test-install.sh
