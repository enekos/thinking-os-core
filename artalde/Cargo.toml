[workspace]
resolver = "3"
members = ["crates/artalde-core", "crates/artalde-mods", "crates/artalde"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enekos/artalde"

[workspace.dependencies]
artalde-core = { path = "crates/artalde-core" }
artalde-mods = { path = "crates/artalde-mods" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
rc_mutex = "deny"
mutex_atomic = "warn"
large_futures = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
unwrap_used = "warn"
let_underscore_must_use = "warn"
dbg_macro = "deny"
todo = "deny"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
