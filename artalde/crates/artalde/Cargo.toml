[package]
name = "artalde"
description = "artalde — a live control plane for the coding agents on your machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "artalde"
path = "src/main.rs"

[dependencies]
artalde-core.workspace = true
artalde-mods.workspace = true
anyhow.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# Monochrome emoji (✅ 🚀) in bot comments; same egui as eframe uses.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
png = "0.17"
pulldown-cmark = { version = "0.13", default-features = false }
# `artalde drive`: render and click through the real UI offscreen, no window.
egui_kittest = { version = "0.37", optional = true, features = ["eframe", "wgpu"] }

[features]
headless = ["dep:egui_kittest"]

[lints]
workspace = true
